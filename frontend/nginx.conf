server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE endpoints (all 6 routes in the backend end in /stream:
    # /api/pipeline/stream, /api/fast-pipeline/stream, /api/scrape/stream,
    # /api/scrape-cm/stream, /api/update-allotment/stream,
    # /api/update-bar/stream) block on queue.Queue.get() until a pipeline
    # run finishes - buffering or a read timeout here would kill the stream
    # mid-run. Must be matched before the generic /api/ location below.
    location ~ ^/api/.*/stream$ {
        proxy_pass http://backend:5666;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:5666;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
