name: Verify backend and frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Syntax-check backend sources
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install MCP server, backend and test dependencies
        run: pip install -r mcp-server/requirements-dev.txt -r backend/requirements.txt
      - name: Run MCP server tests
        working-directory: mcp-server
        run: pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test RMS calculations
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Prevent frontend provider secrets
        run: |
          if grep -R -n -E 'sk-[A-Za-z0-9]{20,}|VITE_(PMS|DEDGE)_(USERNAME|PASSWORD)' frontend/src frontend/.env.example; then
            echo "Remove provider secrets from browser-bundled code."
            exit 1
          fi
